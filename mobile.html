<!doctype html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="only light">
<meta name="robots" content="noindex">
<title>모바일 미리보기 | 예스폼 업무 자동화 도구 시안</title>
<!-- PC에서 공개 사이트(index.html)를 휴대폰 크기로 보는 페이지(2026-10-26). 공개 사이트 루트에 mobile.html로 올림 — 원본: docs/prototype/tools/mobile.html -->
<style>
:root{--bg:#F4F5F7;--ink:#222;--muted:#666;--line:#E6E6E6;--cta:#0472E3}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:14px/1.5 Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;display:flex;flex-direction:column;align-items:center}
header{width:100%;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 24px;background:#fff;border-bottom:1px solid var(--line)}
header h1{margin:0;font-size:16px;font-weight:600}
header .sp{flex:1}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button,.act{height:32px;padding:0 12px;border:1px solid var(--line);border-radius:5px;background:#fff;color:var(--ink);font:inherit;font-size:13px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:4px}
.seg button[aria-pressed="true"]{border-color:var(--cta);background:var(--cta);color:#fff}
.seg button:hover,.act:hover{border-color:var(--cta)}
.seg button[aria-pressed="true"]:hover{color:#fff}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 16px 36px;gap:12px}
.phone{position:relative;padding:34px 12px 16px;border-radius:44px;background:#1d1d1f;box-shadow:0 20px 50px rgba(0,0,0,.18);transition:width .2s,height .2s}
.phone::before{content:"";position:absolute;top:13px;left:50%;width:64px;height:8px;margin-left:-32px;border-radius:4px;background:#3a3a3c}
.phone iframe{display:block;border:0;border-radius:20px;background:#fff}
.size{color:var(--muted);font-size:12.5px}
.note{color:var(--muted);font-size:12.5px;text-align:center;max-width:520px;margin:0}
@media (max-width:600px){.phone{padding:0;border-radius:0;background:none;box-shadow:none}.phone::before{display:none}.phone iframe{border-radius:0}}
</style>
</head>
<body>
<header>
  <h1>모바일 미리보기</h1>
  <div class="seg" role="group" aria-label="기기 크기" id="dev"></div>
  <span class="sp"></span>
  <button type="button" class="act" id="reload">새로고침</button>
  <a class="act" href="./" target="_blank" rel="noopener">PC 화면으로 열기 ↗</a>
</header>
<main>
  <div class="phone" id="phone"><iframe id="f" src="./" title="업무 자동화 도구 시안 — 휴대폰 화면"></iframe></div>
  <div class="size" id="size"></div>
  <p class="note">휴대폰에서 보이는 화면을 PC에서 확인하는 페이지입니다. 처음 한 번 비밀번호를 넣으면 이 브라우저에서는 PC 화면과 같이 쓸 수 있습니다. 실제 휴대폰에서는 주소창에 사이트 주소를 그대로 열면 됩니다.</p>
</main>
<script>
(function(){
  var DEV=[['se','iPhone SE',375,667],['ip','iPhone 15',393,852],['gx','Galaxy S24',360,780],['tab','태블릿',768,1024]];
  var f=document.getElementById('f'),ph=document.getElementById('phone'),sz=document.getElementById('size'),seg=document.getElementById('dev');
  var cur;try{cur=localStorage.getItem('ys-mobile-dev')}catch(e){}
  if(!DEV.some(function(d){return d[0]===cur}))cur='ip';
  function fit(d){   // 화면이 낮으면 기기 높이를 화면에 맞춰 줄임(너비는 그대로)
    var h=Math.min(d[3],Math.max(480,window.innerHeight-170));
    f.style.width=d[2]+'px';f.style.height=h+'px';
    sz.textContent=d[1]+' · '+d[2]+' × '+d[3]+(h<d[3]?' (높이는 화면에 맞춤)':'');
  }
  function draw(){
    seg.innerHTML=DEV.map(function(d){return '<button type="button" data-k="'+d[0]+'" aria-pressed="'+(d[0]===cur)+'">'+d[1]+'</button>'}).join('');
    fit(DEV.filter(function(d){return d[0]===cur})[0]);
  }
  seg.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;cur=b.getAttribute('data-k');try{localStorage.setItem('ys-mobile-dev',cur)}catch(_){}draw()});
  document.getElementById('reload').addEventListener('click',function(){try{f.contentWindow.location.reload()}catch(e){f.src=f.src}});
  // 휴대폰처럼 스크롤바가 폭을 차지하지 않게(PC 스크롤바 15px 숨김) — 비밀번호를 풀면 문서가 바뀌므로 주기적으로 다시 넣음
  setInterval(function(){try{var d=f.contentDocument;if(d&&d.head&&!d.getElementById('ys-mob')){var st=d.createElement('style');st.id='ys-mob';st.textContent='html,body{scrollbar-width:none}::-webkit-scrollbar{display:none}';d.head.appendChild(st)}}catch(e){}},500);
  window.addEventListener('resize',draw);
  draw();
})();
</script>
</body>
</html>
